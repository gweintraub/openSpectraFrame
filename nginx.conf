server {
    listen 80 default_server;
    root /app;
    index index.php index.html;

    # Allow large photo uploads
    client_max_body_size 250M;

    # --- SECURITY RULES ---

    # 1. Block access to hidden files (.env, .git, .gitignore)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Block access to backend data, python scripts, and templates
    location ~ \.(json|py|example|txt|md|yml|yaml|conf)$ {
        deny all;
        return 404;
    }

    # 3. Block direct access to config.php (just in case)
    location = /config.php {
        deny all;
        return 404;
    }

    # 4. Block raw access to session files and specify text files
    location ^~ /sessions/ {
        deny all;
        return 404;
    }

    # ----------------------

    # Main routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Handler
        location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}